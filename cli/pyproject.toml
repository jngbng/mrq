[project]
name = "mrq"
version = "0.1.0"
description = "GitLab MR 리뷰 코멘트를 로컬 파일로 다루는 도구"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21"]

[project.scripts]
mrq = "mrq.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrq"]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
